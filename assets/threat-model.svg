<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-label="The silent re-enrolment attack, with and without this module">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/><stop offset="100%" stop-color="#111C33"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 L0 0 0 32" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.42"/>
    </pattern>
    <marker id="aR" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#F87171"/></marker>
    <marker id="aG" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#34D399"/></marker>
  </defs>
  <rect width="760" height="470" fill="url(#bg)"/>
  <rect width="760" height="470" fill="url(#grid)"/>

  <text x="380" y="38" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">The silent re-enrolment attack</text>
  <text x="380" y="62" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#94A3B8">Face ID proves <tspan font-style="italic">a</tspan> valid biometric is present &#8212; never that it is <tspan font-style="italic">the same</tspan> one.</text>
  <rect x="22" y="82" width="5" height="20" rx="2.5" fill="#F87171"/>
  <text x="38" y="98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="2" fill="#F87171">WITHOUT THIS MODULE</text>
  <rect x="22" y="112" width="358" height="78" rx="10" fill="#1A1220" stroke="#7F1D1D" stroke-width="1.4"/>
  <circle cx="48" cy="144" r="13" fill="#0B1120" stroke="#F87171" stroke-width="1.4"/>
  <text x="48" y="149" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#F87171">1</text>
  <text x="72" y="142" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#FECACA">Device is accessible</text>
  <text x="72" y="164" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#94A3B8">Lost, stolen, or the passcode was seen.</text>
  <path d="M48,191 L48,200" stroke="#F87171" stroke-width="1.6" fill="none" marker-end="url(#aR)"/>
  <rect x="22" y="202" width="358" height="78" rx="10" fill="#1A1220" stroke="#7F1D1D" stroke-width="1.4"/>
  <circle cx="48" cy="234" r="13" fill="#0B1120" stroke="#F87171" stroke-width="1.4"/>
  <text x="48" y="239" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#F87171">2</text>
  <text x="72" y="232" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#FECACA">Attacker enrols a face</text>
  <text x="72" y="254" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#94A3B8">Settings &#8250; Face ID &#8250; Add. Twenty seconds.</text>
  <path d="M48,281 L48,290" stroke="#F87171" stroke-width="1.6" fill="none" marker-end="url(#aR)"/>
  <rect x="22" y="292" width="358" height="78" rx="10" fill="#1A1220" stroke="#7F1D1D" stroke-width="1.4"/>
  <circle cx="48" cy="324" r="13" fill="#0B1120" stroke="#F87171" stroke-width="1.4"/>
  <text x="48" y="329" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#F87171">3</text>
  <text x="72" y="322" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#FECACA">Your app says welcome</text>
  <text x="72" y="344" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#94A3B8">The OS reports success. Session still valid.</text>
  <path d="M48,371 L48,380" stroke="#F87171" stroke-width="1.6" fill="none" marker-end="url(#aR)"/>
  <rect x="22" y="382" width="358" height="78" rx="10" fill="#2A0F16" stroke="#F87171" stroke-width="2"/>
  <circle cx="48" cy="414" r="13" fill="#0B1120" stroke="#F87171" stroke-width="1.4"/>
  <text x="48" y="419" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#F87171">X</text>
  <text x="72" y="412" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#FECACA">Account drained</text>
  <text x="72" y="434" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#94A3B8">Transfers approved by a stranger&#8217;s face.</text>
  <rect x="400" y="82" width="5" height="20" rx="2.5" fill="#34D399"/>
  <text x="416" y="98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="2" fill="#34D399">WITH THIS MODULE</text>
  <rect x="400" y="112" width="358" height="78" rx="10" fill="#0D1A1B" stroke="#065F46" stroke-width="1.4"/>
  <circle cx="426" cy="144" r="13" fill="#0B1120" stroke="#34D399" stroke-width="1.4"/>
  <text x="426" y="149" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#34D399">1</text>
  <text x="450" y="142" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#A7F3D0">App resumes</text>
  <text x="450" y="164" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="11.5" fill="#94A3B8">biometricsChanged() on every foreground.</text>
  <path d="M426,191 L426,200" stroke="#34D399" stroke-width="1.6" fill="none" marker-end="url(#aG)"/>
  <rect x="400" y="202" width="358" height="78" rx="10" fill="#0D1A1B" stroke="#065F46" stroke-width="1.4"/>
  <circle cx="426" cy="234" r="13" fill="#0B1120" stroke="#34D399" stroke-width="1.4"/>
  <text x="426" y="239" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#34D399">2</text>
  <text x="450" y="232" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#A7F3D0">Enrolment compared</text>
  <text x="450" y="254" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#94A3B8">Checked against the stored baseline.</text>
  <path d="M426,281 L426,290" stroke="#34D399" stroke-width="1.6" fill="none" marker-end="url(#aG)"/>
  <rect x="400" y="292" width="358" height="78" rx="10" fill="#0D1A1B" stroke="#065F46" stroke-width="1.4"/>
  <circle cx="426" cy="324" r="13" fill="#0B1120" stroke="#34D399" stroke-width="1.4"/>
  <text x="426" y="329" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#34D399">3</text>
  <text x="450" y="322" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#A7F3D0">Mismatch &#8594; revoke</text>
  <text x="450" y="344" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#94A3B8">Drop tokens, force a full re-login.</text>
  <path d="M426,371 L426,380" stroke="#34D399" stroke-width="1.6" fill="none" marker-end="url(#aG)"/>
  <rect x="400" y="382" width="358" height="78" rx="10" fill="#06251F" stroke="#34D399" stroke-width="2"/>
  <circle cx="426" cy="414" r="13" fill="#0B1120" stroke="#34D399" stroke-width="1.4"/>
  <text x="426" y="419" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#34D399">&#10003;</text>
  <text x="450" y="412" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#A7F3D0">Attack stopped</text>
  <text x="450" y="434" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#94A3B8">The new face inherits nothing.</text>
  <text x="380" y="454" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748B">The device stayed the same the whole time. That is why the device alone was never enough.</text>
</svg>
