<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" role="img" aria-label="Sectors where biometric re-binding detection is standard practice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/><stop offset="100%" stop-color="#111C33"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 L0 0 0 32" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.42"/>
    </pattern>
  </defs>
  <rect width="760" height="250" fill="url(#bg)"/>
  <rect width="760" height="250" fill="url(#grid)"/>

  <text x="380" y="40" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#F8FAFC">Where biometric re-binding checks are table stakes</text>
  <text x="380" y="63" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#94A3B8">Retail banking, wallets and brokerage &#8212; where a device-bound session is worth real money.</text>
  <rect x="22" y="86" width="138" height="46" rx="8" fill="#0F1A2E" stroke="#1E3A5F" stroke-width="1.4"/>
  <text x="91" y="115" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#CBD5E1">Scotiabank</text>
  <rect x="174" y="86" width="138" height="46" rx="8" fill="#0F1A2E" stroke="#1E3A5F" stroke-width="1.4"/>
  <text x="243" y="115" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#CBD5E1">Itaú</text>
  <rect x="326" y="86" width="138" height="46" rx="8" fill="#0F1A2E" stroke="#1E3A5F" stroke-width="1.4"/>
  <text x="395" y="115" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#CBD5E1">BCP</text>
  <rect x="478" y="86" width="138" height="46" rx="8" fill="#0F1A2E" stroke="#1E3A5F" stroke-width="1.4"/>
  <text x="547" y="115" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#CBD5E1">BBVA</text>
  <rect x="630" y="86" width="138" height="46" rx="8" fill="#0F1A2E" stroke="#1E3A5F" stroke-width="1.4"/>
  <text x="699" y="115" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#CBD5E1">Santander</text>
  <rect x="22" y="144" width="138" height="46" rx="8" fill="#0F1A2E" stroke="#1E3A5F" stroke-width="1.4"/>
  <text x="91" y="173" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#CBD5E1">Interbank</text>
  <rect x="174" y="144" width="138" height="46" rx="8" fill="#0F1A2E" stroke="#1E3A5F" stroke-width="1.4"/>
  <text x="243" y="173" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#CBD5E1">Bradesco</text>
  <rect x="326" y="144" width="138" height="46" rx="8" fill="#0F1A2E" stroke="#1E3A5F" stroke-width="1.4"/>
  <text x="395" y="173" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#CBD5E1">Nubank</text>
  <rect x="478" y="144" width="138" height="46" rx="8" fill="#0F1A2E" stroke="#1E3A5F" stroke-width="1.4"/>
  <text x="547" y="173" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#CBD5E1">Banorte</text>
  <rect x="630" y="144" width="138" height="46" rx="8" fill="#0F1A2E" stroke="#1E3A5F" stroke-width="1.4"/>
  <text x="699" y="173" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#CBD5E1">Davivienda</text>
  <text x="380" y="226" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#64748B">Names identify the <tspan font-style="italic">sector</tspan> where this control is expected. They are not users, sponsors or</text>
  <text x="380" y="240" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#64748B">endorsers of this module, and no trademarks are reproduced.</text>
